server.port=5000

# PostgreSQL Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pos_db}
spring.datasource.username=${DB_USERNAME:pogresql}
spring.datasource.password=${DB_PASSWORD:pogresql}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# JWT Configuration
jwt.secret=${JWT_SECRET:7f3d4ef639b5a823cc1de8c9dcfbd2c3ae50db61b2c458a2d1e23f46f88aa8d2}
jwt.expiration=86400000

# Telegram Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:your_telegram_bot_token_here}
telegram.chat.id=${TELEGRAM_CHAT_ID:your_telegram_chat_id_here}

# Static Uploads directory path
upload.dir=public/uploads
